<!DOCTYPE html>
<html lang="en-AU">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Personal Cloud Cinema</title>
   <!-- Production Tailwind CSS framework engine -->
   <script src="https://tailwindcss.com"></script>
   <script>
      tailwind.config = {
         theme: {
            extend: {
               colors: {
                  streamxBg: '#08080a',
                  streamxPanel: '#111116',
                  streamxRed: '#e50914',
                  streamxAmber: '#f59e0b'
               }
            }
         }
      }
   </script>
   <style>
      body { background-color: #08080a; color: #ffffff; }
      /* Hide native browser video styling anomalies */
      video::-webkit-media-controls-panel { background-image: linear-gradient(transparent, rgba(0,0,0,0.7)); }
      /* Custom rolling scrollbar styling */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #08080a; }
      ::-webkit-scrollbar-thumb { background: #22222a; border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: #e50914; }
   </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 antialiased select-none">

   <!-- TOP NAVIGATION BAR -->
   <header class="max-w-7xl w-full mx-auto flex flex-col md:flex-row justify-between items-center bg-zinc-900/60 backdrop-blur-md p-4 rounded-2xl border border-zinc-800/80 gap-4 mb-6 sticky top-0 z-50 shadow-xl shadow-black/40">
      <div class="flex items-center gap-4">
         <!-- Physical Logo Image (With text fallback if file doesn't exist) -->
         <div onclick="resetToHome()" class="flex items-center gap-2 cursor-pointer transition active:scale-95">
            <img src="assets/logo.png" alt="StreamX" class="h-8 w-auto object-contain" onerror="this.outerHTML='<span class=\'text-2xl font-black text-red-600 tracking-tighter\'>STREAM<span class=\'text-zinc-100\'>X</span></span>'">
         </div>
         <!-- Network Status Badging Indicator -->
         <span id="modeBadge" class="text-[10px] tracking-widest uppercase font-black px-2.5 py-0.5 rounded-md bg-amber-500/10 text-amber-500 border border-amber-500/20">Demo Mode</span>
      </div>

      <!-- Quick-Action Category Filter Anchors -->
      <nav id="categoryNavBar" class="flex items-center gap-2 overflow-x-auto max-w-full pb-1 md:pb-0 text-xs font-bold text-zinc-400">
         <button onclick="filterByCategory('All')" class="px-3 py-1.5 rounded-lg bg-zinc-800 text-white cursor-pointer transition hover:bg-zinc-700">All</button>
         <button onclick="filterByCategory('Series')" class="px-3 py-1.5 rounded-lg hover:bg-zinc-800 transition cursor-pointer">Series</button>
         <button onclick="filterByCategory('Movies')" class="px-3 py-1.5 rounded-lg hover:bg-zinc-800 transition cursor-pointer">Movies</button>
      </nav>

      <!-- Global Universal Search Input -->
      <div class="relative w-full md:w-80">
         <input type="text" id="searchBar" oninput="handleUniversalSearch()" placeholder="Search titles, series, or tags..." class="w-full pl-4 pr-10 py-2 bg-zinc-950/80 border border-zinc-800 rounded-xl text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition">
         <div class="absolute right-3 top-2.5 text-zinc-500">🔍</div>
      </div>
   </header>

   <!-- BREADCRUMBS: Directory Tree Location Indicator -->
   <div class="max-w-7xl w-full mx-auto mb-4 flex items-center justify-between text-xs text-zinc-500 px-2 font-semibold tracking-wide">
      <div id="breadcrumbTrack" class="truncate flex items-center gap-1.5">Home</div>
      <button id="backBtn" onclick="goBack()" class="hidden bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-200 px-4 py-1.5 rounded-xl transition cursor-pointer shadow">↩ Back</button>
   </div>

   <!-- MAIN MULTIMEDIA WORKSPACE CANVAS -->
   <main class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
      
      <!-- VIDEO CONTAINER MODULE (Occupies 7 out of 12 columns) -->
      <div class="lg:col-span-7 xl:col-span-8 space-y-4">
         <div class="bg-black rounded-2xl overflow-hidden shadow-2xl border border-zinc-900 aspect-video relative flex items-center justify-center group shadow-black/80">
            <video id="mainPlayer" controls class="w-full h-full hidden z-10" autoplay></video>
            
            <!-- Dynamic Theater Background Wallpaper -->
            <div id="playerBackgroundWallpaper" class="absolute inset-0 bg-cover bg-center opacity-20 filter blur-md transition-all duration-700"></div>
            
            <!-- Default Dashboard Framework Placeholder -->
            <div id="playerPlaceholder" class="text-center p-6 flex flex-col items-center justify-center space-y-3 z-20">
               <img src="assets/popcorn-icon.png" alt="StreamX" class="w-16 h-16 opacity-30 object-contain animate-pulse" onerror="this.outerHTML='<span class=\'text-5xl\'>🍿</span>'">
               <h3 class="text-xl font-extrabold text-zinc-300 tracking-tight">StreamX Cinema Canvas</h3>
               <p class="text-xs text-zinc-500 max-w-xs leading-relaxed">Select any graphical series folder card or media file from your cloud bucket to launch the playback track engine.</p>
            </div>
         </div>
         
         <!-- SEQUENTIAL MEDIA CONTROLLER STRIP -->
         <div class="flex justify-between items-center bg-zinc-900/40 border border-zinc-900 p-4 rounded-2xl shadow-xl backdrop-blur-sm">
            <button onclick="playAdjacent(-1)" class="flex items-center gap-2 px-4 py-2 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-xs md:text-sm font-bold rounded-xl transition cursor-pointer active:scale-95 shadow">⏮️ Prev</button>
            <div class="text-center max-w-[50%] flex flex-col justify-center items-center">
               <span class="text-[10px] uppercase font-black tracking-widest text-zinc-600 block mb-0.5">Now Streaming</span>
               <div id="nowPlayingText" class="font-extrabold text-xs md:text-sm text-zinc-300 truncate w-full">No Active Feed</div>
            </div>
            <button onclick="playAdjacent(1)" class="flex items-center gap-2 px-4 py-2 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-xs md:text-sm font-bold rounded-xl transition cursor-pointer active:scale-95 shadow">Next ⏭️</button>
         </div>
      </div>

      <!-- DYNAMIC STREAMX INTERACTIVE MEDIA BROWSER SIDEBAR (Occupies 5 out of 12 columns) -->
      <div class="lg:col-span-5 xl:col-span-4 bg-zinc-900/40 border border-zinc-900/80 rounded-2xl p-4 flex flex-col h-[585px] shadow-2xl backdrop-blur-sm">
         <div class="border-b border-zinc-800/80 pb-3 mb-4 flex justify-between items-center">
            <span id="sidebarViewTitle" class="text-xs font-black tracking-widest uppercase text-zinc-500">Media Vault Catalog</span>
            <span id="itemCount" class="text-[10px] bg-zinc-950 text-zinc-400 border border-zinc-800/60 px-2.5 py-0.5 font-bold rounded-full shadow-inner">0 Titles</span>
         </div>
         
         <!-- Dynamic Grid Mount Container: This is where cards spawn -->
         <div id="mediaDisplayGrid" class="grid grid-cols-2 gap-4 overflow-y-auto pr-1 flex-1 align-content-start">
            <!-- Driven via Javascript automation block -->
         </div>
      </div>

   </main>

   <!-- Amazon AWS S3 Framework Core Engine Hook -->
   <script src="https://amazonaws.com"></script>
   <script>
      // =========================================================================
      // IDRIVE S3 CLIENT CREDENTIALS CONFIGURATION
      // =========================================================================
      const IDRIVE_CONFIG = {
         accessKeyId: "YOUR_IDRIVE_ACCESS_KEY",        // Replace with Access Key ID
         secretAccessKey: "YOUR_IDRIVE_SECRET_KEY",    // Replace with Secret Access Key
         endpoint: "https://idrivee2.com", // e.g., https://idrivee2-75.com
         bucketName: "your-bucket-name",               // Your target storage bucket
         region: "Automatic"
      };

      // Built-in switch forcing the application to work immediately with sandbox data
      let isDemoMode = true;

      // Automatically turns off Demo Mode when real keys are provided
      if (IDRIVE_CONFIG.accessKeyId !== "YOUR_IDRIVE_ACCESS_KEY" && IDRIVE_CONFIG.accessKeyId.trim() !== "") {
         isDemoMode = false;
      }

      // =========================================================================
      // SANDBOX DEMO DATASET
      // =========================================================================
      const MOCK_LIBRARY = {
         "": [
            { type: "dir", name: "The Office", path: "The Office", category: "Series" },
            { type: "dir", name: "Big Buck Bunny", path: "Big Buck Bunny", category: "Movies" }
         ],
         "The Office": [
            { type: "dir", name: "Season 01", path: "The Office/Season 01", category: "Series" }
         ],
         "The Office/Season 01": [
            { type: "file", name: "S01E01 - Pilot.mp4", path: "The Office/Season 01/S01E01 - Pilot.mp4", category: "Series", streamUrl: "https://googleapis.com" },
            { type: "file", name: "S01E02 - Diversity Day.mp4", path: "The Office/Season 01/S01E02 - Diversity Day.mp4", category: "Series", streamUrl: "https://googleapis.com" }
         ],
         "Big Buck Bunny": [
            { type: "file", name: "Big Buck Bunny.mp4", path: "Big Buck Bunny/Big Buck Bunny.mp4", category: "Movies", streamUrl: "https://googleapis.com" }
         ]
      };

      // App State Tracking Parameters
      let currentPath = "";
      let pathHistory = [];
      let activeFolderItems = [];
      let currentVideoIndex = -1;
      let activeCategoryFilter = "All";
      let s3Instance = null;

      // Initialize System Engine Instantly
      window.onload = () => {
         const badge = document.getElementById("modeBadge");
         if (!isDemoMode) {
            badge.innerText = "IDrive Connected";
            badge.className = "text-[10px] tracking-widest uppercase font-black px-2.5 py-0.5 rounded-md bg-green-500/10 text-green-500 border border-green-500/20";
            
            AWS.config.update({
               accessKeyId: IDRIVE_CONFIG.accessKeyId,
               secretAccessKey: IDRIVE_CONFIG.secretAccessKey,
               region: IDRIVE_CONFIG.region
            });
            s3Instance = new AWS.S3({ endpoint: new AWS.Endpoint(IDRIVE_CONFIG.endpoint), s3ForcePathStyle: true });
         }
         resetToHome();
      };

      function resetToHome() {
         pathHistory = [];
         currentPath = "";
         document.getElementById("backBtn").style.display = "none";
         document.getElementById("breadcrumbTrack").innerHTML = `<span class="text-zinc-400">Home</span>`;
         loadDirectory("");
      }

      // =========================================================================
      // DIRECTORY SCANNING ENGINE
      // =========================================================================
      async function loadDirectory(path) {
         currentPath = path;
         document.getElementById("backBtn").style.display = path === "" ? "none" : "block";
         
         // Build Breadcrumb Layout Link Nodes
         if (path !== "") {
            let breadcrumbHtml = `<span class="cursor-pointer text-zinc-400 hover:text-white transition" onclick="resetToHome()">Home</span>`;
            let runningPath = "";
            path.split('/').forEach(folder => {
               runningPath += (runningPath ? '/' : '') + folder;
               const capturePath = runningPath; 
               breadcrumbHtml += ` <span class="text-zinc-700">/</span> <span class="cursor-pointer text-zinc-400 hover:text-white transition" onclick="loadDirectory('${capturePath}')">${folder}</span>`;
            });
            document.getElementById("breadcrumbTrack").innerHTML = breadcrumbHtml;
            document.getElementById("sidebarViewTitle").innerText = path.split('/').pop();
         } else {
            document.getElementById("breadcrumbTrack").innerHTML = `<span class="text-zinc-400">Home</span>`;
            document.getElementById("sidebarViewTitle").innerText = "Media Vault Catalog";
         }

         if (isDemoMode) {
            activeFolderItems = MOCK_LIBRARY[path] || [];
            renderGrid(activeFolderItems);
         } else {
            fetchIDriveItems(path);
         }
      }

      function fetchIDriveItems(prefix) {
         const grid = document.getElementById("mediaDisplayGrid");
         grid.innerHTML = `<div class="col-span-2 text-center text-zinc-500 text-xs py-12 animate-pulse font-bold tracking-wide">SCANNING CLOUD BUCKET...</div>`;

         const params = {
            Bucket: IDRIVE_CONFIG.bucketName,
            Delimiter: '/',
            Prefix: prefix ? prefix + '/' : ''
         };

         s3Instance.listObjectsV2(params, function(err, data) {
            if (err) {
               grid.innerHTML = `<div class="col-span-2 text-center text-red-500 text-xs py-12 font-bold">S3 ERROR: CHECK SECURITY KEYS CONFIG</div>`;
               return;
            }

            activeFolderItems = [];

            // 1. Map Directories (Series and Seasons)
            if (data.CommonPrefixes) {
               data.CommonPrefixes.forEach(p => {
                  let folderPath = p.Prefix.replace(/\/$/, ""); 
                  let folderName = folderPath.split('/').pop();
                  
                  // Auto-categorise base directories based on key rules
                  let cat = "Series";
                  if (folderPath.toLowerCase().includes('movie')) cat = "Movies";

                  activeFolderItems.push({ type: "dir", name: folderName, path: folderPath, category: cat });
               });
            }

            // 2. Map Streamable Video Tracks (.mp4 or .webm)
            if (data.Contents) {
               data.Contents.forEach(f => {
                  let fileName = f.Key.split('/').pop();
                  if (fileName && (fileName.toLowerCase().endsWith('.mp4') || fileName.toLowerCase().endsWith('.webm'))) {
                     let cat = "Series";
                     if (f.Key.toLowerCase().includes('movie')) cat = "Movies";
                     
                     activeFolderItems.push({ type: "file", name: fileName, path: f.Key, category: cat });
                  }
               });
            }

            renderGrid(activeFolderItems);
         });
      }

      // =========================================================================
      // VISUAL GRID RENDERING
      // =========================================================================
      function renderGrid(items) {
         const grid = document.getElementById("mediaDisplayGrid");
         grid.innerHTML = "";

         // Apply Category Filters natively before pushing layout nodes
         const filteredItems = items.filter(item => {
            if (currentPath !== "") return true; // Only filter on the root Home screen
            return activeCategoryFilter === "All" || item.category === activeCategoryFilter;
         });

         document.getElementById("itemCount").innerText = `${filteredItems.length} Titles`;

         if (filteredItems.length === 0) {
            grid.innerHTML = `<div class="col-span-2 text-center text-zinc-600 text-xs py-12 italic font-semibold">No media matching filter parameters.</div>`;
            return;
         }

         filteredItems.forEach((item) => {
            const isFolder = item.type === "dir";
            const card = document.createElement("div");
            
            const trueIndex = activeFolderItems.findIndex(f => f.path === item.path);
            const isActivePlaying = trueIndex === currentVideoIndex;

            if (isFolder) {
               // Portrait Aspect Ratio Layout Setup (1:1.5) [Series & Season Covers: Portrait (1:1.5 Ratio)]
               const r2Root = isDemoMode ? "assets" : `${IDRIVE_CONFIG.endpoint}/${IDRIVE_CONFIG.bucketName}`;
               const folderCover = `${r2Root}/${item.path}/season-cover.jpg`;
               const seriesCover = `${r2Root}/${item.path}/cover.jpg`;

               card.className = "bg-zinc-950/60 border border-zinc-900 hover:border-red-600 rounded-xl overflow-hidden cursor-pointer transition transform hover:scale-[1.03] group shadow-lg";
               card.innerHTML = `
                  <div class="relative aspect-[1/1.5] w-full bg-zinc-900 flex items-center justify-center overflow-hidden border-b border-zinc-900/60 shadow-inner">
                     <img src="${folderCover}" onerror="this.src='${seriesCover}'; this.onerror=function(){this.src='assets/default-folder.png'; this.onerror=function(){this.style.display='none'; document.getElementById('vect-'+${trueIndex}).style.display='flex';}}" class="absolute w-full h-full object-cover group-hover:scale-105 transition duration-500">
               const r2Root = isDemoMode ? "assets" : `${IDRIVE_CONFIG.endpoint}/${IDRIVE_CONFIG.bucketName}`;
               const thumbPath = item.path.replace(/\.[^/.]+$/, "") + ".jpg"; // Pairs .mp4 with matching name .jpg
               const videoCover = `${r2Root}/${thumbPath}`;

               card.className = `border rounded-xl overflow-hidden cursor-pointer transition transform hover:scale-[1.03] group col-span-2 shadow-lg ${isActivePlaying ? 'border-red-600 bg-red-950/10' : 'border-zinc-900 hover:border-zinc-700 bg-zinc-950/30'}`;
               card.innerHTML = `
                  <div class="flex items-center p-2 gap-3">
                     <div class="relative aspect-video w-28 bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800/80 flex-shrink-0 flex items-center justify-center">
                        <img src="${videoCover}" onerror="this.src='assets/default-video.png'; this.onerror=function(){this.style.display='none'; document.getElementById('playv-'+${trueIndex}).style.display='flex';}" class="absolute w-full h-full object-cover">
                        <div id="playv-${trueIndex}" class="w-7 h-7 bg-black/60 backdrop-blur rounded-full flex items-center justify-center text-xs text-red-600 border border-zinc-800 z-20 group-hover:scale-110 transition shadow shadow-black">▶️</div>
                     </div>
                     <div class="text-left truncate flex-1 pr-2">
                        <span class="text-xs font-extrabold text-zinc-300 block truncate group-hover:text-zinc-100 transition ${isActivePlaying ? 'text-red-500 font-black' : ''}">${item.name.replace(/\.[^/.]+$/, "")}</span>
                        <span class="text-[10px] text-zinc-600 font-bold block uppercase tracking-widest mt-1">${item.category} Track</span>
                     </div>
                  </div>`;
               card.onclick = () => playTargetVideo(trueIndex);
            }
            grid.appendChild(card);
         });
      }

      // =========================================================================
      // SECURE STREAM PIPELINES & PLAYER CONTROLS
      // =========================================================================
      async function playTargetVideo(index) {
         const item = activeFolderItems[index];
         if (!item || item.type !== "file") return;

         currentVideoIndex = index;
         let resolvedStreamUrl = "";

         if (isDemoMode) {
            resolvedStreamUrl = item.streamUrl;
         } else {
            // Generates an authenticated S3 Pre-Signed security URL valid for 1 full hour
            resolvedStreamUrl = s3Instance.getSignedUrl('getObject', {
               Bucket: IDRIVE_CONFIG.bucketName,
               Key: item.path,
               Expires: 3600 
            });
         }

         const player = document.getElementById("mainPlayer");
         const wall = document.getElementById("playerBackgroundWallpaper");
         
         if(document.getElementById("playerPlaceholder")) document.getElementById("playerPlaceholder").classList.add("hidden");
         
         if (player) {
            player.classList.remove("hidden");
            player.src = resolvedStreamUrl;
         }

         // Update dynamic theatre ambient glowing wallpaper backing
         if (wall) {
            const r2Root = isDemoMode ? "assets" : `${IDRIVE_CONFIG.endpoint}/${IDRIVE_CONFIG.bucketName}`;
            const thumbPath = item.path.replace(/\.[^/.]+$/, "") + ".jpg";
            wall.style.backgroundImage = `url('${r2Root}/${thumbPath}'), url('assets/default-video.png')`;
         }

         if (document.getElementById("nowPlayingText")) {
            document.getElementById("nowPlayingText").innerText = item.name.replace(/\.[^/.]+$/, "");
         }

         renderGrid(activeFolderItems);
         if (player) player.onended = () => playAdjacent(1); // Auto progression logic
      }

      function playAdjacent(direction) {
         let target = currentVideoIndex + direction;
         while (target >= 0 && target < activeFolderItems.length) {
            if (activeFolderItems[target].type === "file") {
               playTargetVideo(target);
               return;
            }
            target += direction;
         }
      }

      // =========================================================================
      // FILTER & SEARCH HELPERS
      // =========================================================================
      function filterByCategory(category, element) {
         activeCategoryFilter = category;
         
         // Toggle styling tabs inside the category strip visually
         const buttons = document.getElementById("categoryNavBar").children;
         for(let btn of buttons) {
            btn.className = "px-3 py-1.5 rounded-lg hover:bg-zinc-800 transition cursor-pointer";
         }
         if (event && event.target) event.target.className = "px-3 py-1.5 rounded-lg bg-zinc-800 text-white cursor-pointer transition";
         
         resetToHome();
      }

      function handleUniversalSearch() {
         const q = document.getElementById("searchBar").value.toLowerCase().trim();
         const items = document.getElementById("mediaDisplayGrid").children;
         
         let count = 0;
         for (let card of items) {
            const matchName = card.getAttribute("data-name") || "";
            if (matchName.includes(q)) {
               card.style.display = "block";
               count++;
            } else {
               card.style.display = "none";
            }
         }
         document.getElementById("itemCount").innerText = `${count} Matches`;
      }

      function goBack() { if (pathHistory.length > 0) loadDirectory(pathHistory.pop()); }
   </script>
</body>
</html>
